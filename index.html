<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: monospace;
    }
    
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    
    .message {
      position: absolute;
      bottom: 100px;
      width: 100%;
      text-align: center;
      z-index: 10;
      color: #9ca3af;
      font-size: 14px;
    }
    
    @media (min-width: 640px) {
      .message {
        font-size: 16px;
      }
    }
    
    @media (min-width: 768px) {
      .message {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas" aria-label="Interactive particle effect with Coming Soon text"></canvas>
  <div class="message">
    Stay tuned for our exciting announcement
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("particleCanvas");
      const ctx = canvas.getContext("2d");

      let mousePosition = { x: 0, y: 0 };
      let isTouching = false;
      let isMobile = false;
      let particles = [];
      let textImageData = null;
      let animationFrameId;

      // Update canvas size and check if mobile
      function updateCanvasSize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        isMobile = window.innerWidth < 768;
      }

      updateCanvasSize();

      // Create text image and get pixel data
      function createTextImage() {
        if (!ctx || !canvas) return 0;

        ctx.fillStyle = "white";
        ctx.save();

        // Draw "COMING SOON" text
        const fontSize = isMobile ? 40 : 80;
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Position text in center
        const text = "COMING SOON";
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        ctx.restore();

        textImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        return fontSize / 40; // Return scale based on font size
      }

      // Create a single particle
      function createParticle(scale) {
        if (!ctx || !canvas || !textImageData) return null;

        const data = textImageData.data;

        for (let attempt = 0; attempt < 100; attempt++) {
          const x = Math.floor(Math.random() * canvas.width);
          const y = Math.floor(Math.random() * canvas.height);

          if (data[(y * canvas.width + x) * 4 + 3] > 128) {
            return {
              x: x,
              y: y,
              baseX: x,
              baseY: y,
              size: Math.random() * 1 + 0.5,
              color: "white",
              scatteredColor: Math.random() > 0.5 ? "#00DCFF" : "#FF9900", // Randomly assign cyan or orange
              life: Math.random() * 100 + 50,
            };
          }
        }

        return null;
      }

      // Create initial set of particles
      function createInitialParticles(scale) {
        const baseParticleCount = 7000;
        const particleCount = Math.floor(baseParticleCount * Math.sqrt((canvas.width * canvas.height) / (1920 * 1080)));

        for (let i = 0; i < particleCount; i++) {
          const particle = createParticle(scale);
          if (particle) particles.push(particle);
        }
      }

      // Animation loop
      function animate(scale) {
        if (!ctx || !canvas) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const mouseX = mousePosition.x;
        const mouseY = mousePosition.y;
        const maxDistance = 240;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const dx = mouseX - p.x;
          const dy = mouseY - p.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < maxDistance && (isTouching || !("ontouchstart" in window))) {
            const force = (maxDistance - distance) / maxDistance;
            const angle = Math.atan2(dy, dx);
            const moveX = Math.cos(angle) * force * 60;
            const moveY = Math.sin(angle) * force * 60;
            p.x = p.baseX - moveX;
            p.y = p.baseY - moveY;

            ctx.fillStyle = p.scatteredColor;
          } else {
            p.x += (p.baseX - p.x) * 0.1;
            p.y += (p.baseY - p.y) * 0.1;
            ctx.fillStyle = "white";
          }

          ctx.fillRect(p.x, p.y, p.size, p.size);

          p.life--;
          if (p.life <= 0) {
            const newParticle = createParticle(scale);
            if (newParticle) {
              particles[i] = newParticle;
            } else {
              particles.splice(i, 1);
              i--;
            }
          }
        }

        const baseParticleCount = 7000;
        const targetParticleCount = Math.floor(
          baseParticleCount * Math.sqrt((canvas.width * canvas.height) / (1920 * 1080))
        );

        while (particles.length < targetParticleCount) {
          const newParticle = createParticle(scale);
          if (newParticle) particles.push(newParticle);
        }

        animationFrameId = requestAnimationFrame(() => animate(scale));
      }

      // Event handlers
      function handleMove(x, y) {
        mousePosition = { x, y };
      }

      function handleMouseMove(e) {
        handleMove(e.clientX, e.clientY);
      }

      function handleTouchMove(e) {
        if (e.touches.length > 0) {
          e.preventDefault();
          handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }

      function handleTouchStart() {
        isTouching = true;
      }

      function handleTouchEnd() {
        isTouching = false;
        mousePosition = { x: 0, y: 0 };
      }

      function handleMouseLeave() {
        if (!("ontouchstart" in window)) {
          mousePosition = { x: 0, y: 0 };
        }
      }

      function handleResize() {
        updateCanvasSize();
        const newScale = createTextImage();
        particles = [];
        createInitialParticles(newScale);
      }

      // Add event listeners
      window.addEventListener("resize", handleResize);
      canvas.addEventListener("mousemove", handleMouseMove);
      canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
      canvas.addEventListener("mouseleave", handleMouseLeave);
      canvas.addEventListener("touchstart", handleTouchStart);
      canvas.addEventListener("touchend", handleTouchEnd);

      // Initialize
      const scale = createTextImage();
      createInitialParticles(scale);
      animate(scale);
    });
  </script>
</body>
</html>
